<app-sidebar></app-sidebar>

<main>
    <div class="perfil-container">

        <header class="cabecalho">
            <span>SUA CONTA E SEU NEGÓCIO</span>
            <h1>Meu perfil</h1>
        </header>

        <section class="perfil-destaque">
            <div class="perfil-info">
                <div class="foto-perfil">
                    G
                </div>

                <div class="dados-perfil">
                    <h2>gabriel</h2>
                    <p>Gabriel Sampaio · Moda e criatividade</p>
                </div>
            </div>

            <button class="botao-trocar-foto">
                Trocar foto
            </button>
        </section>

        <section class="card">
            <div class="card-cabecalho">
                <div>
                    <span>MINHA CONTA</span>
                    <h2>Informações pessoais</h2>
                </div>

                <div class="icone-card">
                    <span>♙</span>
                </div>
            </div>

            <div class="formulario">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        value="gabriel"
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        value="sampaiowebdesign26@gmail.com"
                    >
                </div>

                <div class="campo campo-completo">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        value="(11) 99876-2210"
                    >
                </div>

            </div>
        </section>

        <section class="card">
            <div class="card-cabecalho">
                <div>
                    <span>MEU NEGÓCIO</span>
                    <h2>O que você constrói</h2>
                </div>

                <div class="icone-card">
                    <span>▣</span>
                </div>
            </div>

            <div class="formulario">

                <div class="campo campo-completo">
                    <label for="negocio">Nome do negócio</label>
                    <input
                        type="text"
                        id="negocio"
                        value="Gabriel Sampaio"
                    >
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <input
                        type="text"
                        id="categoria"
                        value="Moda e criatividade"
                    >
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input
                        type="text"
                        id="cidade"
                        value="São Paulo, SP"
                    >
                </div>

                <div class="campo campo-completo">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao">Camisetas autorais e personalizadas para marcas que querem vestir boas ideias.</textarea>
                </div>

            </div>
        </section>

        <div class="acoes">
            <button class="botao-salvar">
                Salvar alterações
                <span>→</span>
            </button>
        </div>

    </div>
</main>
