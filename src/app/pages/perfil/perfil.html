<app-sidebar></app-sidebar>

<main>
    <div class="perfil-container">

        <header class="cabecalho">
            <span>SUA CONTA E SEU NEGÓCIO</span>
            <h1>Meu perfil</h1>
        </header>

        <section class="perfil-destaque">
            <div class="perfil-info">
                <div class="foto-perfil">
                    {{ usuario.nome ? usuario.nome.charAt(0).toUpperCase() : '?' }}
                </div>

                <div class="dados-perfil">
                    <h2>{{ usuario.nome || 'Seu nome' }}</h2>
                    <p>{{ usuario.email }}</p>
                </div>
            </div>
        </section>

        <form (ngSubmit)="salvarPerfil()">

            <section class="card">
                <div class="card-cabecalho">
                    <div>
                        <span>MINHA CONTA</span>
                        <h2>Informações pessoais</h2>
                    </div>

                    <div class="icone-card">
                        <span>♙</span>
                    </div>
                </div>

                <div class="formulario">

                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            [(ngModel)]="usuario.nome"
                            required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            [(ngModel)]="usuario.email"
                            required>
                    </div>

                    <div class="campo campo-completo">
                        <label for="telefone">Telefone</label>
                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            [(ngModel)]="telefone">
                    </div>

                </div>
            </section>

            <section class="card">
                <div class="card-cabecalho">
                    <div>
                        <span>MEU NEGÓCIO</span>
                        <h2>O que você constrói</h2>
                    </div>

                    <div class="icone-card">
                        <span>▣</span>
                    </div>
                </div>

                <div class="formulario">

                    <div class="campo campo-completo">
                        <label for="negocio">Nome do negócio</label>
                        <input
                            type="text"
                            id="negocio"
                            name="negocio"
                            [(ngModel)]="negocio">
                    </div>

                    <div class="campo">
                        <label for="categoria">Categoria</label>
                        <input
                            type="text"
                            id="categoria"
                            name="categoria"
                            [(ngModel)]="categoria">
                    </div>

                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            [(ngModel)]="cidade">
                    </div>

                    <div class="campo campo-completo">
                        <label for="descricao">Descrição</label>
                        <textarea
                            id="descricao"
                            name="descricao"
                            [(ngModel)]="descricao"></textarea>
                    </div>

                </div>
            </section>

            <div class="acoes">
                <button
                    type="submit"
                    class="botao-salvar">
                    Salvar alterações
                    <span>→</span>
                </button>
            </div>

        </form>

        <p class="mensagem-sucesso" *ngIf="mensagem">
            {{ mensagem }}
        </p>

    </div>
</main>
