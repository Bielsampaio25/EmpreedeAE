<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | EmpreendeAÊ</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <header class="cabecalho">
        <a routerLink="/home" class="voltar">
            <span class="icone-voltar">‹</span>
            Voltar para o início
        </a>

        <p class="link-cadastro">
            Ainda não tem uma conta?
            <a routerLink="/cadastro">Criar conta</a>
        </p>
    </header>

    <main class="conteudo-principal">
        <section class="area-login">

            <p class="subtitulo">BEM-VINDO DE VOLTA</p>

            <h1>Entre para continuar.</h1>

            <form class="formulario-login" (ngSubmit)="entrar()">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Digite seu email">
                </div>

                <div class="campo campo-senha">
                    <label for="senha">Senha</label>

                    <div class="entrada-senha">
                        <input type="password" id="senha" name="senha" [(ngModel)]="senha"
                            placeholder="Digite sua senha">
                    </div>
                </div>

                <div class="opcao-termos">
    <input
        type="checkbox"
        id="termos"
        name="termos"
        [(ngModel)]="aceitouTermos"
    >

    <label for="termos">
        Aceito os
        <a href="#">termos e condições</a>.
    </label>
</div>
                <button type="submit" class="botao-entrar">
                    <span>Entrar</span>
                    <span class="seta-botao">→</span>
                </button>

            </form>

            <p class="texto-privacidade">
                Ao entrar, você concorda com os
                <a>Termos de Uso</a>
                e a
                <a>Política de Privacidade.</a>
            </p>
        </section>
    </main>
</body>

</html>
