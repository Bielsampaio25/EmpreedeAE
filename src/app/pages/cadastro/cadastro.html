<header class="cabecalho">
    <a routerLink="/home" class="voltar">
        <span class="icone-voltar">‹</span>
        Voltar para o início
    </a>

    <p class="link-login">
        Já tem uma conta?
        <a routerLink="/login">Entrar</a>
    </p>
</header>

<main class="conteudo-principal">
    <section class="area-cadastro">

        <p class="subtitulo">COMECE SUA JORNADA</p>

        <h1>Crie sua conta.</h1>

        <form class="formulario-cadastro" (ngSubmit)="cadastrar()">

            <div class="linha-formulario">
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" [(ngModel)]="usuario.nome" placeholder="Seu nome">
                </div>

                <div class="campo">
                    <label for="negocio">Nome do negócio</label>
                    <input type="text" id="negocio" name="negocio" placeholder="Como sua marca se chama?">
                </div>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" [(ngModel)]="usuario.email"
                    placeholder="Digite seu email">
            </div>

            <div class="linha-formulario">
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" [(ngModel)]="usuario.senha"
                        placeholder="Mínimo 6 caracteres">
                </div>
            </div>

            <div class="opcao">
                <input type="checkbox" id="termos" name="termos" [(ngModel)]="aceitouTermos">

                <label for="termos">
                    Li e aceito os
                    <a routerLink="/termos">Termos de Uso</a>
                    e a
                    <a routerLink="/politica">Política de Privacidade.</a>
                </label>
            </div>

            <button type="submit" class="botao-cadastro">
                <span>Criar minha conta</span>
                <span class="seta-botao">→</span>
            </button>

        </form>
    </section>
</main>
