<app-sidebar></app-sidebar>

<main>
    <section class="confirmacao">

        <div class="icone-sucesso">
            <span>✓</span>
        </div>

        <span class="subtitulo">PAGAMENTO CONFIRMADO</span>

        <h1>Pagamento bem-sucedido!</h1>

        <p class="descricao">
            Seu plano <strong>{{ plano }}</strong> foi ativado.
            Você já pode começar a construir seu espaço<br class="desktop">
            digital.
        </p>

        <div class="plano-selecionado">

            <span>Plano selecionado</span>

            <strong>
                {{ plano }} · R$ {{ valor }}/mês
            </strong>

        </div>

        <button routerLink="/site" class="botao-painel">
            Ir para meu painel
            <span>→</span>
        </button>

        <a href="/planos" class="voltar-planos">
            Voltar para planos
        </a>

    </section>
</main>
