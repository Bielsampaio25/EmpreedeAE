<app-sidebar></app-sidebar>

<main>
    <div class="pagina">

        <div class="cabecalho">
            <span>ESTEJA CONECTADO</span>
            <h1>Comunidade</h1>
        </div>

        <section class="chat">

            <div class="mensagens">

                <div
                    *ngFor="let mensagem of mensagens"
                    class="mensagem"
                    [class.mensagem-esquerda]="mensagem.lado === 'esquerda'"
                    [class.mensagem-direita]="mensagem.lado === 'direita'"
                >

                    <span class="nome">
                        {{ mensagem.nome }}
                    </span>

                    <div class="balao">
                        {{ mensagem.texto }}

                        <div class="status">
                            {{ mensagem.status }}
                        </div>
                    </div>

                </div>

            </div>

            <form
                class="campo-mensagem"
                (ngSubmit)="enviarMensagem()"
            >

                <input
                    type="text"
                    name="mensagem"
                    [(ngModel)]="novaMensagem"
                    placeholder="Digite uma mensagem..."
                    autocomplete="off"
                >

                <button
                    type="submit"
                    aria-label="Enviar mensagem"
                >
                    <span>→</span>
                </button>

            </form>

        </section>

    </div>
</main>
