<aside class="sidebar">

    <div class="logo">
        <img src="/images/image_logo_EmpreendeAE.png" alt="">
        <span>EmpreendeAÊ</span>
    </div>

    <nav class="menu">

        <span class="titulo-menu">MENU PRINCIPAL</span>

        <a routerLink="/site" class="item">
            <img src="/icones/icone_site.png" alt="">
            <span>Meu site</span>
        </a>

        <a routerLink="/editarSite" class="item">
            <img src="/icones/icone_edicao.png" alt="">
            <span>Editar site</span>
        </a>

        <a routerLink="/comunidade" class="item">
            <img src="/icones/icone_social.png" alt="">
            <span>Comunidade</span>
        </a>

        <a routerLink="/perfil" class="item">
            <img src="/icones/icone_perfil.png" alt="">
            <span>Meu perfil</span>
        </a>

        <span class="titulo-menu conta">CONTA</span>

        <a routerLink="/planos" class="item">
            <img src="/icones/icone_planos.png" alt="">
            <span>Planos</span>
        </a>

        <a href="#" class="item">
            <img src="/icones/icone_termos.png" alt="">
            <span>Ajuda e termos</span>
        </a>

    </nav>

    <div class="perfil">

        <div class="perfil-avatar">
            {{ usuario.nome ? usuario.nome.charAt(0).toUpperCase() : 'G' }}
        </div>

        <div class="perfil-info">
            <strong>{{ usuario.nome || 'Usuário' }}</strong>
            <span>{{ usuario.email || 'E-mail não informado' }}</span>
        </div>

        <button type="button" class="logout" (click)="logout()">↪</button>

    </div>

</aside>
